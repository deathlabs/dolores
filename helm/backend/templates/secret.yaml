# helm/templates/secret.yaml

---
{{- if .Values.envSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-env
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.envSecret.data | nindent 2 }}
{{- end }}
