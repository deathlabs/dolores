# uds-package.yaml

---
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  namespace: dolores
  name: dolores
spec:
  network:
    expose:
      - service: backend
        selector:
          app.kubernetes.io/component: backend
        host: dolores
        port: 8000
    allow:
      - description: Backend to database
        direction: Egress
        selector:
          app.kubernetes.io/component: backend
        remoteNamespace: dolores
        remoteSelector:
          app.kubernetes.io/component: database
        port: 5432
      - description: Database from backend
        direction: Ingress
        selector:
          app.kubernetes.io/component: database
        remoteNamespace: dolores
        remoteSelector:
          app.kubernetes.io/component: backend
        port: 5432
  sso:
    - name: Dolores
      clientId: dolores
      redirectUris:
        - https://dolores.uds.dev/login
      enableAuthserviceSelector:
        app.kubernetes.io/component: backend
