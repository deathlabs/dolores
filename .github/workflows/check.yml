---
name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    paths:
      - ".github/workflows/**"
      - "backend/**"
      - "database/**"
      - "inference/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      dockerfile_lint_scan_failure_threshold:
        description: "Threshold to fail the Dockerfile lint check."
        type: choice
        options: [error, warning, info, style, ignore]
        default: error
      sbom_scan_failure_threshold:
        description: "Threshold to fail the SBOM scan."
        type: choice
        options: [low, high, critical]
        default: low
  schedule:
    - cron: '00 12 * * *' 

jobs:

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
      - name: Run Trufflehog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: false

  python-code-lint:
    name: Python Code Lint Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - inference
          - tools
    steps:
      - name: Run Python Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --output-format=sarif --output-file=code-lint-scan-${{ matrix.container }}.sarif"
          src: ${{ matrix.container }}
      - name: Upload Code Lint Scan
        uses: actions/upload-artifact@v7
        with:
          name: code-lint-scan-${{ matrix.container }}
          path: code-lint-scan-${{ matrix.container }}.sarif

  dockerfile-lint:
    name: Dockerfile Lint Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - inference
          - tools
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.container }}/Dockerfile
          failure-threshold: ${{ github.event.inputs.dockerfile_lint_scan_failure_threshold || 'error' }}
          format: sarif
          output-file: dockerfile-lint-scan-${{ matrix.container }}.sarif
      - name: Upload Dockerfile Lint Scan
        uses: actions/upload-artifact@v7
        with:
          path: dockerfile-lint-scan-${{ matrix.container }}.sarif
          archive: false

  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - inference
          - tools
    container:
      image: semgrep/semgrep
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
      - name: Run Semgrep
        run: semgrep scan --config auto ${{ matrix.container }} --sarif --sarif-output=sast-scan-${{ matrix.container }}.sarif
      - name: Upload SAST Scan
        uses: actions/upload-artifact@v7
        with:
          path: sast-scan-${{ matrix.container }}.sarif
          archive: false

  sca:
    name: SBOM Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        container:
          - backend
          - inference
          - tools
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
      - name: Run Syft
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.container }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.container }}.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          path: sbom-${{ matrix.container }}.json
          archive: false
      - name: Run Grype
        uses: anchore/scan-action@v7
        with:
          sbom: sbom-${{ matrix.container }}.json
          severity-cutoff: ${{ github.event.inputs.sbom_scan_failure_threshold || 'low' }}
          output-format: cyclonedx-json
          output-file: sbom-scan-${{ matrix.container }}.json
      - name: Upload SBOM Scan
        uses: actions/upload-artifact@v7
        with:
          path: sbom-scan-${{ matrix.container }}.json
          archive: false
